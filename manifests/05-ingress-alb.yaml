# ALB Ingress - Routes external traffic to the on-premises server.
#   /  → server-hybrid-1 (on-premises)
# Note: podinfo only serves its own routes (/, /healthz, etc). Path-based
# routing like /cloud would be forwarded as-is and return 404 - the cloud
# comparison is done via kubectl exec in the runbook instead.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo-stone
  labels:
    demo: hybrid-resilience
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: hybrid-resilience-demo-alb
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/tags: "auto-delete=no,Project=hybrid-resilience-demo"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server-hybrid-1
                port:
                  number: 9898
