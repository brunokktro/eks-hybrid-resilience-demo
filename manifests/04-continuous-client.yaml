# Continuous Client - Runs on the SAME hybrid node and keeps calling podinfo.
# During network disconnect, this proves that:
#   1. Pods continue processing requests (not just "Running" status)
#   2. Pod-to-pod communication within the on-prem network works
#   3. ClusterIP service resolution works (Cilium datapath local)
#
# The client logs every request with timestamp - visible via:
#   kubectl logs -n demo-stone deploy/continuous-client -f
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuous-client
  namespace: demo-stone
  labels:
    app: continuous-client
    tier: hybrid
    demo: hybrid-resilience
spec:
  replicas: 1
  selector:
    matchLabels:
      app: continuous-client
      tier: hybrid
  template:
    metadata:
      labels:
        app: continuous-client
        tier: hybrid
        demo: hybrid-resilience
    spec:
      # MUST run on hybrid node (same node as podinfo-hybrid)
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid

      # Same tolerations - survives disconnect
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              echo "=== Continuous Client Started ==="
              echo "Target: http://podinfo-hybrid.demo-stone:9898/"
              echo "Interval: every 5 seconds"
              echo "================================="
              SEQ=0
              while true; do
                SEQ=$((SEQ + 1))
                TIMESTAMP=$(date '+%H:%M:%S')
                RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 3 --max-time 5 \
                  http://podinfo-hybrid.demo-stone:9898/healthz 2>/dev/null || echo "TIMEOUT")
                if [ "$RESPONSE" = "200" ]; then
                  echo "[${TIMESTAMP}] #${SEQ} STATUS=200 OK - pod is processing"
                else
                  echo "[${TIMESTAMP}] #${SEQ} STATUS=${RESPONSE} - connectivity issue"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
