# Podinfo on Hybrid Nodes (On-Premises)
# Includes tolerations for resilience during network disconnection.
#
# Key behavior:
#   - Pods are pinned to hybrid nodes via nodeSelector
#   - Tolerations prevent eviction when node becomes unreachable
#   - Without tolerationSeconds: pods survive indefinitely
#   - With tolerationSeconds: 3600 = 1 hour (demo), production should omit
#
# Reference: https://docs.aws.amazon.com/eks/latest/best-practices/hybrid-nodes-network-disconnections.html
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-stone
  labels:
    demo: hybrid-resilience
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-hybrid
  namespace: demo-stone
  labels:
    app: podinfo
    tier: hybrid
    demo: hybrid-resilience
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
      tier: hybrid
  template:
    metadata:
      labels:
        app: podinfo
        tier: hybrid
        demo: hybrid-resilience
    spec:
      # Schedule only on hybrid nodes (on-premises)
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid

      # Tolerations: the core of the resilience demo
      tolerations:
        # Tolerate node unreachable (control plane lost contact)
        # Default K8s behavior without this: evict after 300s
        # With this: pod survives for tolerationSeconds (or indefinitely if omitted)
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600  # 1h for demo. Production: OMIT for indefinite.

        # Tolerate node not-ready (intermediate state before unreachable)
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600

        # Tolerate Cilium agent not-ready
        # Cilium may restart during disconnection (health coupled to kube-api)
        # This prevents scheduling failures on reconnect
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
              name: http
            - containerPort: 9999
              name: grpc
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Hybrid Node (On-Premises)"
            - name: PODINFO_UI_COLOR
              value: "#2E7D32"  # Green = on-prem
          command:
            - ./podinfo
            - --port=9898
            - --grpc-port=9999
            - --level=info
            - --random-delay=false
            - --random-error=false
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-hybrid
  namespace: demo-stone
  labels:
    app: podinfo
    tier: hybrid
spec:
  type: ClusterIP
  ports:
    - port: 9898
      targetPort: http
      name: http
    - port: 9999
      targetPort: grpc
      name: grpc
  selector:
    app: podinfo
    tier: hybrid
