# SERVER-HYBRID-2: Podinfo on Hybrid Node 2 (On-Premises)
# Target for cross-node test: client-hybrid-to-hybrid (Node 1) calls this.
# Proves multi-node on-prem communication works during AWS disconnect.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-hybrid-2
  namespace: demo-stone
  labels:
    app: server
    location: hybrid
    node-id: node2
    demo: hybrid-resilience
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
      location: hybrid
      node-id: node2
  template:
    metadata:
      labels:
        app: server
        location: hybrid
        node-id: node2
        demo: hybrid-resilience
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
        hybrid-node-id: node2

      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
              name: http
          env:
            - name: PODINFO_UI_MESSAGE
              value: "SERVER-HYBRID-2 (On-Premises, Node 2)"
            - name: PODINFO_UI_COLOR
              value: "#1B5E20"
          command:
            - ./podinfo
            - --port=9898
            - --level=info
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server-hybrid-2
  namespace: demo-stone
spec:
  type: ClusterIP
  ports:
    - port: 9898
      targetPort: http
      name: http
  selector:
    app: server
    location: hybrid
    node-id: node2
