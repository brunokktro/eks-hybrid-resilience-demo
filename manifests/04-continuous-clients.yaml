# Continuous Clients - Prove ACTIVE processing during network disconnection.
#
# TWO clients, each proving a different communication path:
#
#   ┌─────────────────────────────────────────────────────────────┐
#   │  CLIENT-HYBRID (on-prem)  →  SERVER podinfo-hybrid (on-prem) │
#   │  Proves: local pod-to-pod processing continues               │
#   │  Expected during disconnect: STATUS=200 (always)             │
#   └─────────────────────────────────────────────────────────────┘
#
#   ┌─────────────────────────────────────────────────────────────┐
#   │  CLIENT-CLOUD (AWS)  →  SERVER podinfo-hybrid (on-prem)      │
#   │  Proves: cross-cluster communication path                    │
#   │  Expected during disconnect: STATUS=TIMEOUT (link down)      │
#   │  Expected after recovery: STATUS=200 (auto-heals)            │
#   └─────────────────────────────────────────────────────────────┘
#
# During the demo, show BOTH terminals side by side:
#   Terminal 1: kubectl logs deploy/client-hybrid -n demo-stone -f
#   Terminal 2: kubectl logs deploy/client-cloud -n demo-stone -f
#
# The contrast is powerful:
#   - client-hybrid: 200 200 200 200 (uninterrupted)
#   - client-cloud:  200 200 TIMEOUT TIMEOUT TIMEOUT ... 200 200 (recovers)
---
# ═══════════════════════════════════════════════════════════════════════════════
# CLIENT-HYBRID: On-premises client → On-premises server
# Proves LOCAL pod-to-pod processing continues during disconnect
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-hybrid
  namespace: demo-stone
  labels:
    app: client
    tier: hybrid
    role: client
    demo: hybrid-resilience
  annotations:
    description: "Client on HYBRID node calling podinfo-hybrid. Proves local processing."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
      tier: hybrid
  template:
    metadata:
      labels:
        app: client
        tier: hybrid
        role: client
        demo: hybrid-resilience
    spec:
      # Same node as podinfo-hybrid (on-premises)
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid

      # Tolerations to survive disconnect
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              echo "╔══════════════════════════════════════════════════╗"
              echo "║  CLIENT-HYBRID → podinfo-hybrid (LOCAL)         ║"
              echo "║  Both pods on the SAME on-premises node         ║"
              echo "║  This should NEVER fail during disconnect       ║"
              echo "╚══════════════════════════════════════════════════╝"
              SEQ=0
              while true; do
                SEQ=$((SEQ + 1))
                TS=$(date '+%H:%M:%S')
                CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 3 --max-time 5 \
                  http://podinfo-hybrid.demo-stone:9898/healthz 2>/dev/null || echo "000")
                if [ "$CODE" = "200" ]; then
                  echo "[${TS}] #${SEQ} → podinfo-hybrid | STATUS=200 ✓ processing"
                else
                  echo "[${TS}] #${SEQ} → podinfo-hybrid | STATUS=${CODE} ✗ ISSUE"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
# ═══════════════════════════════════════════════════════════════════════════════
# CLIENT-CLOUD: AWS cloud client → On-premises server
# Proves cross-cluster communication (and shows it breaks during disconnect)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-cloud
  namespace: demo-stone
  labels:
    app: client
    tier: cloud
    role: client
    demo: hybrid-resilience
  annotations:
    description: "Client on CLOUD node calling podinfo-hybrid. Shows cross-cluster path."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
      tier: cloud
      role: client
  template:
    metadata:
      labels:
        app: client
        tier: cloud
        role: client
        demo: hybrid-resilience
    spec:
      # Runs on AWS cloud node
      nodeSelector:
        eks.amazonaws.com/compute-type: ec2

      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              echo "╔══════════════════════════════════════════════════╗"
              echo "║  CLIENT-CLOUD → podinfo-hybrid (CROSS-CLUSTER)  ║"
              echo "║  Client in AWS, Server on-premises               ║"
              echo "║  This WILL fail during disconnect (expected)     ║"
              echo "╚══════════════════════════════════════════════════╝"
              SEQ=0
              while true; do
                SEQ=$((SEQ + 1))
                TS=$(date '+%H:%M:%S')
                CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 3 --max-time 5 \
                  http://podinfo-hybrid.demo-stone:9898/healthz 2>/dev/null || echo "000")
                if [ "$CODE" = "200" ]; then
                  echo "[${TS}] #${SEQ} → podinfo-hybrid | STATUS=200 ✓ cross-cluster OK"
                elif [ "$CODE" = "000" ]; then
                  echo "[${TS}] #${SEQ} → podinfo-hybrid | STATUS=TIMEOUT ✗ link down"
                else
                  echo "[${TS}] #${SEQ} → podinfo-hybrid | STATUS=${CODE} ✗ error"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
