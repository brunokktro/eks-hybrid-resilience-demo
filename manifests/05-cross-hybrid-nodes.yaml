# Pod-to-Pod Communication Across Hybrid Nodes (Multi-Node On-Premises)
#
# This manifest deploys a SERVER + CLIENT pair specifically to validate
# communication BETWEEN two different hybrid nodes in the same vSphere environment.
#
# This is the closest scenario to production:
#   - Multiple on-prem nodes (like a real datacenter)
#   - Pod on Node A calls Pod on Node B (cross-node, same LAN)
#   - Proves Cilium overlay (VXLAN) works across on-prem nodes without control plane
#
# Topology:
#   ┌─ Hybrid Node 1 ──────────────┐     ┌─ Hybrid Node 2 ──────────────┐
#   │  [podinfo-hybrid] (replicas)  │     │  [podinfo-node2] (server)    │
#   │  [client-hybrid] → local      │     │  [client-cross-node] → node1  │
#   └───────────────────────────────┘     └───────────────────────────────┘
#         ▲                                       │
#         └───────── Cilium VXLAN (on-prem) ──────┘
#
# Prerequisites:
#   - Two hybrid nodes registered in the cluster
#   - Both in the same RemoteNodeNetwork CIDR (192.168.3.0/24)
#   - Cilium running on both (VXLAN mesh between them)
#
# Label your second hybrid node BEFORE applying this manifest:
#   kubectl label node <SECOND_HYBRID_NODE> hybrid-node-id=node2
#
# Usage:
#   kubectl label node mi-XXXXXXXXXX hybrid-node-id=node2
#   kubectl apply -f manifests/05-cross-hybrid-nodes.yaml
---
# ═══════════════════════════════════════════════════════════════════════════════
# SERVER on Hybrid Node 2
# Podinfo instance pinned to the second hybrid node
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-node2
  namespace: demo-stone
  labels:
    app: podinfo
    tier: hybrid
    hybrid-node: node2
    demo: hybrid-resilience
  annotations:
    description: "SERVER on Hybrid Node 2. Target for cross-node communication test."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      hybrid-node: node2
  template:
    metadata:
      labels:
        app: podinfo
        tier: hybrid
        hybrid-node: node2
        demo: hybrid-resilience
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
        hybrid-node-id: node2

      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
              name: http
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Hybrid Node 2 (On-Premises - vSphere VM #2)"
            - name: PODINFO_UI_COLOR
              value: "#1B5E20"  # Dark green = on-prem node 2
          command:
            - ./podinfo
            - --port=9898
            - --level=info
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-node2
  namespace: demo-stone
  labels:
    app: podinfo
    hybrid-node: node2
spec:
  type: ClusterIP
  ports:
    - port: 9898
      targetPort: http
      name: http
  selector:
    app: podinfo
    hybrid-node: node2
---
# ═══════════════════════════════════════════════════════════════════════════════
# CLIENT-CROSS-NODE: Hybrid Node 1 → Hybrid Node 2
# Proves pod-to-pod communication ACROSS on-prem nodes (Cilium VXLAN mesh)
# This is the production scenario: microservices distributed across DC nodes
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-cross-node
  namespace: demo-stone
  labels:
    app: client
    tier: hybrid
    role: client-cross-node
    demo: hybrid-resilience
  annotations:
    description: "Client on Hybrid Node 1 calling server on Hybrid Node 2. Proves multi-node on-prem."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
      role: client-cross-node
  template:
    metadata:
      labels:
        app: client
        tier: hybrid
        role: client-cross-node
        demo: hybrid-resilience
    spec:
      # Runs on the FIRST hybrid node (default, no node2 label)
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
        hybrid-node-id: node1

      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: client
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              echo "╔══════════════════════════════════════════════════════╗"
              echo "║  CLIENT-CROSS-NODE: Node1 → Node2 (MULTI-NODE)     ║"
              echo "║  Both nodes on-premises, different VMs in vSphere   ║"
              echo "║  Communication via Cilium VXLAN (on-prem overlay)   ║"
              echo "║  Should continue during AWS disconnect              ║"
              echo "╚══════════════════════════════════════════════════════╝"
              SEQ=0
              while true; do
                SEQ=$((SEQ + 1))
                TS=$(date '+%H:%M:%S')
                CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 3 --max-time 5 \
                  http://podinfo-node2.demo-stone:9898/healthz 2>/dev/null || echo "000")
                if [ "$CODE" = "200" ]; then
                  echo "[${TS}] #${SEQ} → podinfo-node2 | STATUS=200 ✓ cross-node OK"
                elif [ "$CODE" = "000" ]; then
                  echo "[${TS}] #${SEQ} → podinfo-node2 | STATUS=TIMEOUT ✗ cross-node down"
                else
                  echo "[${TS}] #${SEQ} → podinfo-node2 | STATUS=${CODE} ✗ error"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
