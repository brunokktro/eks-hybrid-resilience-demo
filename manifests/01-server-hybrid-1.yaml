# SERVER-HYBRID-1: Podinfo on Hybrid Node 1 (On-Premises)
# This is the primary on-prem server. Receives requests from:
#   - client-hybrid (local, same node)
#   - client-cloud-to-hybrid (cross-cluster, from AWS)
#   - ALB ingress (external traffic)
#
# Tolerations keep it alive during network disconnection.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-stone
  labels:
    demo: hybrid-resilience
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-hybrid-1
  namespace: demo-stone
  labels:
    app: server
    location: hybrid
    node-id: node1
    demo: hybrid-resilience
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
      location: hybrid
      node-id: node1
  template:
    metadata:
      labels:
        app: server
        location: hybrid
        node-id: node1
        demo: hybrid-resilience
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
        hybrid-node-id: node1

      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 3600
        - key: "node.cilium.io/agent-not-ready"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
              name: http
            - containerPort: 9999
              name: grpc
          env:
            - name: PODINFO_UI_MESSAGE
              value: "SERVER-HYBRID-1 (On-Premises, Node 1)"
            - name: PODINFO_UI_COLOR
              value: "#2E7D32"
          command:
            - ./podinfo
            - --port=9898
            - --grpc-port=9999
            - --level=info
            - --random-delay=false
            - --random-error=false
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server-hybrid-1
  namespace: demo-stone
spec:
  type: ClusterIP
  ports:
    - port: 9898
      targetPort: http
      name: http
  selector:
    app: server
    location: hybrid
    node-id: node1
